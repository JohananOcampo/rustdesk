name: JBODTECH Controlled Windows Pilot
run-name: JBODTECH pilot ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Control-plane correlation UUID
        required: true
        type: string
      source_commit:
        description: Centrally approved RustDesk source commit
        required: true
        type: string
      spec_sha256:
        description: SHA-256 of canonical non-secret build specification
        required: true
        type: string
      spec_json:
        description: Canonical non-secret build specification
        required: true
        type: string
      schema_version:
        description: Closed build specification schema version
        required: true
        type: string

permissions:
  contents: read

env:
  APPROVED_SOURCE_COMMIT: f54c0fa28dde53f58afe2e1c2add8693b4b4797a

concurrency:
  group: jbodtech-pilot-${{ inputs.dispatch_id }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate closed request
        shell: bash
        env:
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SPEC_SHA256: ${{ inputs.spec_sha256 }}
          SPEC_JSON: ${{ inputs.spec_json }}
          SCHEMA_VERSION: ${{ inputs.schema_version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import uuid

          dispatch_id = os.environ["DISPATCH_ID"]
          if str(uuid.UUID(dispatch_id)) != dispatch_id:
              raise SystemExit("invalid dispatch identifier")
          source_commit = os.environ["SOURCE_COMMIT"]
          if source_commit != os.environ["APPROVED_SOURCE_COMMIT"]:
              raise SystemExit("unapproved source commit")
          if re.fullmatch(r"[0-9a-f]{64}", os.environ["SPEC_SHA256"]) is None:
              raise SystemExit("invalid specification digest")
          spec_json = os.environ["SPEC_JSON"]
          if len(spec_json.encode("utf-8")) > 8192:
              raise SystemExit("specification too large")
          if hashlib.sha256(spec_json.encode("utf-8")).hexdigest() != os.environ["SPEC_SHA256"]:
              raise SystemExit("specification integrity mismatch")
          spec = json.loads(spec_json)
          if spec.get("schema_version") != 1 or spec.get("source_commit") != source_commit:
              raise SystemExit("specification binding mismatch")
          if os.environ["SCHEMA_VERSION"] != "1":
              raise SystemExit("unsupported specification schema")
          PY

  build-unsigned-windows-pilot:
    needs: validate-request
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: pilot-${{ inputs.dispatch_id }}
      source-commit: ${{ inputs.source_commit }}
      build-spec-json: ${{ inputs.spec_json }}
      build-spec-sha256: ${{ inputs.spec_sha256 }}
      windows-pilot-only: true
      publish-release: false
